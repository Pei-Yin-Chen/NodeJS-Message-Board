server {
    listen 80;               # 守在 80 號門 (HTTP 標準埠號)
    server_name localhost;   # 當網址是 localhost 時生效

    # A 區：如果路徑是 / (首頁或前端資源)
    location / {
        root /usr/share/nginx/html;  # 去這裡找檔案
        index index.html;            # 預設開啟 index.html
        try_files $uri $uri/ /index.html; # 如果找不到檔案，就把球丟回 index.html (交給 React Router)
    }

    # B 區：如果路徑是 /api 開頭
    location /api/ {
        proxy_pass http://backend:5000; # 把請求轉發給「後端容器」
        proxy_set_header Host $host;     # 保留原始網址資訊
        proxy_set_header X-Real-IP $remote_addr; # 告訴後端是誰連進來的
    }
}